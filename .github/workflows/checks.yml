name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic Python regressions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build the frontend
        working-directory: frontend
        run: |
          npx --yes pnpm@10.22.0 install --frozen-lockfile
          npx --yes pnpm@10.22.0 run build
      - name: Verify served frontend assets
        run: |
          python - <<'PY'
          import re
          from fastapi.testclient import TestClient
          from backend.app import app

          with TestClient(app) as client:
              client.get("/healthz").raise_for_status()
              page = client.get("/")
              page.raise_for_status()
              assets = re.findall(r'(?:src|href)="(/assets/[^"]+)"', page.text)
              assert any(path.endswith(".js") for path in assets), assets
              assert any(path.endswith(".css") for path in assets), assets
              for path in assets:
                  client.get(path).raise_for_status()
          PY
